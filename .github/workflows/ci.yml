name: CI

on:
  pull_request:
    branches: [main, samuel-code]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build e testes
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify